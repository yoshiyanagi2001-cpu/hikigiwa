<title>引き際の迷宮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column. Lantern-lit dungeon panels with hard 2px borders and stepped shadows, like an old pixel role-playing game. Single deliberate dark world. */
:root{
  --bg:#1b1815; --panel:#262119; --panel2:#30291f; --line:#4a3f31; --shadow:#0e0c0a; --well:#13110e;
  --ink:#efe5d0; --muted:#a8997f; --brass:#e3ae4c; --brass-ink:#2a1d08;
  --blood:#d9533f; --heal:#6dbb7a; --sky:#6fb6dc; --magic:#a685ec; --poison:#9cc04a; --heart:#f08fb0;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none;max-width:100%}
img.dim{opacity:.45}
h1,h2,h3{font-family:var(--pix);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.title{font-size:1.9rem;color:var(--brass);letter-spacing:.06em;text-shadow:0 2px 0 var(--shadow)}
.eyebrow{font-family:var(--pix);font-size:.75rem;letter-spacing:.2em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.78rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:14px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{font-family:var(--pix);background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:10px 14px;box-shadow:0 3px 0 var(--shadow);text-align:center;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--brass);border-color:#f6cf7c;color:var(--brass-ink)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:7px 10px;font-size:.85rem;flex:none}
.btn.xs{padding:4px 8px;font-size:.78rem;box-shadow:0 2px 0 var(--shadow)}
.btn.danger{color:var(--blood)}
.btn.on{border-color:var(--brass);color:var(--brass);white-space:normal}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.purse{display:flex;align-items:center;gap:6px;font-family:var(--pix);background:var(--panel);border:2px solid var(--line);padding:6px 10px;border-radius:3px;flex:none}
.purse b{font-size:1.15rem;color:var(--brass);font-weight:400;font-variant-numeric:tabular-nums}
.purse span{font-size:.75rem;color:var(--muted)}
.purse.sm{padding:4px 8px}
.purse.sm b{font-size:1rem}
.news{background:var(--panel2);border-left:4px solid var(--brass);padding:8px 12px;font-size:.85rem}
.hero{flex-direction:row;gap:14px;align-items:flex-start}
.hero-pic{background:var(--well);border:2px solid var(--line);padding:6px;border-radius:3px;flex:none}
.hero-body{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero h2{font-size:1.2rem}
.trait{font-size:.8rem;color:var(--muted)}
.trait b{color:var(--ink);font-weight:700;margin-right:.5em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats div{background:var(--panel2);border:1px solid var(--line);padding:4px 6px;border-radius:2px;min-width:0}
.stats dt{font-size:.7rem;color:var(--muted)}
.stats dd{margin:0;font-family:var(--pix);font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.eqrow{display:flex;gap:6px}
.slot-empty{width:28px;height:28px;border:2px dashed var(--line);border-radius:2px;display:block;flex:none}
.irow .slot-empty{width:36px;height:36px}
.buff{font-size:.8rem;color:var(--heal)}
.dg-head{display:flex;gap:12px;align-items:center}
.dg-head h2{font-size:1.25rem}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.facts li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.facts span{color:var(--muted)}
.facts b{font-family:var(--pix);font-weight:400}
.gold{color:var(--brass)}
.locked{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);opacity:.75}
.facil{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--shadow);min-width:0}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.tile.alert{border-color:var(--brass)}
.t-name{font-family:var(--pix);font-size:1.05rem}
.t-sub{font-size:.75rem;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--muted);align-items:center}
.link{text-decoration:underline}
.foot .link:first-of-type{margin-left:auto}
.link.armed{color:var(--blood)}

.sub{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sub h2{font-size:1.25rem;flex:1;min-width:0}
.back{font-family:var(--pix);color:var(--muted);padding:6px 0;flex:none}
.sec{font-size:.95rem;color:var(--brass);display:flex;align-items:baseline;gap:8px;margin-top:4px}
.sec small{font-family:var(--ui);font-size:.72rem;color:var(--muted)}
.irow{display:flex;align-items:center;gap:10px;width:100%;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;min-width:0}
.irow.ghost{background:transparent;border-style:dashed}
.ibody{display:flex;flex-direction:column;min-width:0;flex:1}
.isub{font-size:.75rem;color:var(--muted)}
.nm{font-family:var(--pix);overflow-wrap:anywhere}
.r-fine{color:var(--sky)}
.r-epic{color:var(--brass)}
.r-cursed{color:var(--magic)}
.r-heart{color:var(--heart)}
.chev{color:var(--muted);font-family:var(--pix);flex:none}
.ibtn{flex:none}
.mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:45%}
.empty{font-size:.85rem;color:var(--muted);padding:6px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:.8rem;padding:4px 10px;border:2px solid var(--line);border-radius:99px;color:var(--muted)}
.chip.on{border-color:var(--brass);color:var(--brass)}
.tabs{display:flex;gap:6px;margin-bottom:-12px}
.tab{flex:1;font-family:var(--pix);padding:8px;border:2px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;background:var(--panel2);color:var(--muted);text-align:center}
.tab.on{background:var(--panel);color:var(--ink)}
.tabs + .card{border-top-left-radius:0;border-top-right-radius:0}
.wrow{display:flex;align-items:center;gap:10px;font-size:.85rem}
.wrow .bar{flex:1}
.wrow b{font-family:var(--pix);font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#0f0d0b;border:2px solid var(--line);border-radius:2px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--heal);transition:width .25s steps(4)}
.bar.low i,.bar.ehp i{background:var(--blood)}
.bar.wt i{background:var(--sky)}
.bar.warn i{background:var(--brass)}
.bar.xp i{background:var(--magic)}
.dock{position:sticky;bottom:0;background:var(--bg);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line)}
.dockline{font-size:.75rem;color:var(--muted);text-align:center}
.warnline{font-size:.8rem;color:var(--brass)}
.npc{display:flex;gap:12px;align-items:center;font-size:.88rem;background:var(--panel2);padding:10px;border-radius:2px}
.tag{font-family:var(--pix);font-size:.68rem;border:1px solid currentColor;padding:0 5px;margin-left:6px;border-radius:2px;color:var(--muted);white-space:nowrap}
.tag.r-fine{color:var(--sky)}
.tag.r-epic{color:var(--brass)}
.tag.r-cursed{color:var(--magic)}
.tag.r-heart{color:var(--heart)}
.up{color:var(--heal)}
.ty{font-family:var(--pix);font-size:.66rem;padding:0 5px;margin-left:6px;border-radius:2px;border:1px solid currentColor;vertical-align:2px;white-space:nowrap}
.ty-read{color:var(--magic)}.ty-atk{color:#f0896f}.ty-guard{color:var(--sky)}.ty-dodge{color:var(--heal)}.ty-brk{color:var(--brass)}
.stc{font-family:var(--pix);font-size:.78rem;background:var(--panel2);border:1px solid var(--line);padding:1px 8px;margin-right:8px;border-radius:2px;white-space:nowrap}
.intent.danger .stc{border-color:var(--blood);color:#ffb3a6}
.intent.hidden{color:var(--muted);border-style:dashed}
.tipbtn{font-size:.78rem;color:var(--muted);text-decoration:underline;align-self:flex-start}
.tips{list-style:none;margin:0;padding:8px 10px;background:var(--panel);border:2px dashed var(--line);border-radius:3px;display:flex;flex-direction:column;gap:4px;font-size:.78rem}
.tips li{display:grid;grid-template-columns:4.2em 1fr;align-items:baseline;gap:6px}
.tips .ty{margin-left:0;text-align:center}
.reel{filter:brightness(.8);transform:rotate(-10deg)}
textarea.spell{width:100%;font-family:var(--pix);font-size:.95rem;line-height:1.8;letter-spacing:.06em;background:var(--well);color:var(--ink);border:2px solid var(--line);border-radius:2px;padding:8px 10px;resize:vertical}
textarea.spell:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.spell-err{font-family:var(--pix);color:var(--blood)}
.link + .link{margin-left:0}
.carry{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carry b{font-family:var(--pix);font-weight:400;font-size:1.2rem;color:var(--brass);font-variant-numeric:tabular-nums}
.cbtns{display:flex;gap:6px;margin-left:auto}
.sortbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.heroswitch{display:flex;gap:6px;flex-wrap:wrap}
.btn.favx{min-width:30px;padding-left:6px;padding-right:6px}
.px.ghosty{opacity:.82;filter:drop-shadow(0 0 6px rgba(127,209,224,.55))}
.card.quest .qhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.questbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:8px 12px;box-shadow:0 3px 0 var(--shadow)}
.questbar .ibody{flex:1;min-width:0;display:flex;flex-direction:column}
.questbar .nm{font-size:.95rem}
.card.quest h3{margin:0;font-size:1rem}
.qreread{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.qtext{color:var(--ink)}
.story{display:flex;flex-direction:column;gap:12px;padding-top:16px}
.story .story-pic{display:flex;justify-content:center}
.story .eyebrow,.story .title{text-align:center}
.story-text{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:8px;line-height:1.8}
.story-text p{margin:0}
.qnext{background:var(--panel2);border:2px dashed var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.qnext p{margin:0}.qnext ul{margin:4px 0 0;padding-left:1.2em}
.questgot{border-color:#5aa6b3}
.zk.legend{border-color:var(--brass)}
.risk{display:inline-block;margin-left:8px;font-size:.66rem;padding:1px 6px;border-radius:2px;border:1px solid;vertical-align:middle;font-family:var(--ui);letter-spacing:0}
.risk.rk0{color:#8fd49a;border-color:#47824f}
.risk.rk1{color:#f2c94c;border-color:#a8801f}
.risk.rk2{color:#ff8a7a;border-color:#8e2230;background:rgba(142,34,48,.18)}
.choice.gate{border-color:#5aa6b3}
.abyssrow .small{color:var(--muted)}
.srow.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagc{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.tagc.bad{color:#ff8a7a;border-color:#8e2230}
.card.d3{border-color:#4a3f5c;background:linear-gradient(180deg,#1f1a26,var(--panel))}
.recent summary{cursor:pointer;color:var(--muted);font-size:.8rem;margin-top:6px}
.recent ul{margin:6px 0 0;padding-left:1.1em;font-size:.8rem;line-height:1.7}
.recent li.down{color:#ff8a7a}
.scoreg .score{font-size:1.05rem}
.scoreg .score b{font-size:1.4rem;color:var(--brass)}
.zsk b{color:var(--ink);font-weight:normal;margin-right:4px}
.btn.favx.on{color:var(--brass)}
.act.hsk{border-color:#6d4a5a}
.hlv{font-size:.62rem;color:var(--heart);margin-left:4px}
.herog{flex-direction:row;align-items:center;gap:10px;text-align:left}
.me .pet + .pet{margin-left:-4px}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.top .title{white-space:nowrap;font-size:clamp(1.45rem,6.4vw,1.9rem)}
.top{align-items:center}
@media (max-width:430px){.top .purse span{display:none}.hbtns{gap:6px}.achbtn{padding:5px 6px}}
.achbtn{display:flex;align-items:center;gap:6px;font-family:var(--pix);font-size:.78rem;color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:5px 8px;white-space:nowrap}
.achbtn.glow{color:var(--brass);border-color:var(--brass);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 10px 1px rgba(227,174,76,.55)}}
.alist{display:flex;flex-direction:column;gap:6px}
.arow.live{opacity:1;border-color:var(--line)}
.arow.live .amark,.arow.marked .amark{color:var(--brass)}
.arow.glow{border-color:var(--brass);animation:glow 1.6s ease-in-out infinite}
.arow.marked{opacity:1;border-style:dashed;border-color:var(--brass)}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,440px);background:var(--panel2);border:2px solid var(--blood);color:#ffb3a6;font-size:.82rem;padding:8px 12px;border-radius:3px;box-shadow:0 4px 0 var(--shadow)}
@media (prefers-reduced-motion:reduce){.achbtn.glow,.arow.glow{animation:none}}
@media (max-width:380px){.dhead .dgname{display:none}}
.arow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;opacity:.75}
.arow.ok{opacity:1;border-color:var(--brass)}
.amark{font-size:1.2rem;color:var(--muted);line-height:1.3}
.arow.ok .amark{color:var(--brass)}
.arow.ok .nm{color:var(--brass)}
.achgot{display:flex;flex-direction:column;gap:4px;font-family:var(--pix);color:var(--brass);background:var(--panel2);border:2px solid var(--brass);border-radius:3px;padding:8px}
.foes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foe.multi{padding:8px;gap:6px;min-width:0;width:100%;text-align:left;font:inherit;color:inherit}
button.foe.multi{cursor:pointer}
.foe.multi.target{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.foe.multi .foe-top h3{font-size:.9rem}
.foe.multi .intent{font-size:.72rem;padding:4px 6px;text-align:left}
.foe.multi .stc{margin-right:4px;display:inline-block;margin-bottom:2px}
.tag.tg{color:var(--brass)}
.cun{font-size:.68rem;color:var(--muted)}
.intent.sense{border-style:dashed;color:var(--ink)}
.intent.sense .stc{border-style:dashed}
.intent.mikiri{border-color:var(--brass)}
.mk{font-family:var(--pix);font-size:.7rem;color:var(--brass-ink);background:var(--brass);padding:0 6px;margin-right:6px;border-radius:2px}
.center{text-align:center}
.insv{font-family:var(--pix);font-size:.9rem}
.insv small{font-family:var(--ui);font-size:.68rem;color:var(--blood);margin-left:4px}
.preset{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;min-width:0}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper b{font-family:var(--pix);font-weight:400;font-size:1.05rem;min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.scr-dive{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;background:var(--bg);border-top:2px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -4px 0 var(--shadow)}
.qbar.empty{justify-content:center;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.qslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 4px 4px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;box-shadow:0 3px 0 var(--shadow);flex:none}
.qslot:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.qslot:disabled{opacity:.4;cursor:default}
.qn{position:absolute;top:2px;right:4px;font-family:var(--pix);font-size:.78rem;color:var(--brass)}
.ql{font-size:.62rem;color:var(--muted);white-space:nowrap}
.dungeon.d2{border-color:#6b2f35;background:linear-gradient(180deg,#2a1a1c,var(--panel))}
.dungeon.d2 h2{color:#f0896f}
.dgname{font-family:var(--ui);font-size:.7rem;color:var(--muted);margin-left:8px;align-self:center}
.eopts{display:flex;flex-direction:column;gap:8px}
.eopt{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.eopt .ehead{display:flex;flex-direction:column;min-width:0}
.eopt .mats{grid-column:1;display:flex;flex-wrap:wrap;gap:6px}
.eopt .btn{grid-column:2;grid-row:1 / span 3}
.eopt p{grid-column:1}
.eopt.no .ehead .nm{color:var(--muted)}
.mat{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--blood);background:var(--well);border:1px solid var(--line);padding:1px 6px;border-radius:2px;white-space:nowrap}
.mat.ok{color:var(--heal)}
.isub.ench{color:var(--magic)}
button.irow:disabled{opacity:.7;cursor:default}
.fav{color:var(--brass);margin-right:4px;font-size:.9em}
.sheet-acts .btn.favbtn{flex:1 1 100%;color:var(--brass)}
.btn.favbtn.on{border-color:var(--brass)}
.cnt{font-family:var(--pix);font-size:.82rem;color:var(--brass);margin-left:6px}
.eqbtn{border-radius:2px;padding:2px}
.eqbtn:hover{background:var(--panel2)}
button.irow{text-align:left}
.town-carry b{font-size:1.05rem}
img.sil{filter:brightness(0);opacity:.5}
.zukan{display:flex;flex-direction:column;gap:6px}
.zk{display:flex;gap:10px;align-items:center;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;min-width:0}
.zk.unk .nm{color:var(--muted)}
.hgot{display:flex;align-items:center;gap:6px;color:var(--heart);font-family:var(--pix)}
.pet{background:var(--well);border:2px solid var(--heart);border-radius:2px;padding:2px;flex:none}
.down{color:var(--blood)}

.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.floor{display:flex;align-items:baseline;gap:4px;font-family:var(--pix);flex-wrap:wrap}
.floor b{font-size:2rem;color:var(--brass);font-weight:400;line-height:1}
.ftag{margin-left:8px;font-size:.8rem;border:2px solid var(--line);padding:2px 8px;color:var(--muted);border-radius:2px;align-self:center}
.status{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:2px solid var(--line);padding:10px 12px;border-radius:3px}
.srow{display:grid;grid-template-columns:2.6em 1fr auto;align-items:center;gap:8px;font-size:.8rem;min-width:0}
.lab{color:var(--muted);font-size:.75rem}
.num{font-family:var(--pix);font-weight:400;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:4.5em;text-align:right}
.kehai{display:flex;align-items:center;gap:8px;font-size:.8rem;flex-wrap:wrap}
.kehai .lab{width:2.6em}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:10px;background:#0f0d0b;border:2px solid var(--line)}
.k0 .pips i:nth-child(-n+1){background:#7b8f6a}
.k1 .pips i:nth-child(-n+2){background:var(--brass)}
.k2 .pips i:nth-child(-n+3){background:#e07a3c}
.k3 .pips i{background:var(--blood)}
.k3 .kt{color:#ff9d8e}
.pz{font-family:var(--pix);font-size:.72rem;background:var(--poison);color:#1b2108;padding:1px 6px;border-radius:2px}
.scene{display:flex;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:12px;align-items:flex-start;min-width:0}
.frame{background:radial-gradient(circle at 50% 62%,#3d3123 0%,#120f0c 75%);border:2px solid var(--line);padding:8px;border-radius:2px;flex:none}
.stext{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:.9rem}
.stext h3{font-size:1.05rem;color:var(--brass)}
.scene.compact{padding:8px 12px}
.scene.compact .stext{font-size:.8rem}
.lvup{color:var(--heal);font-family:var(--pix)}
.fallen{filter:grayscale(1) brightness(.6);transform:rotate(8deg)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;box-shadow:0 4px 0 var(--shadow);min-width:0}
.choice:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.choice:disabled{opacity:.45;cursor:default}
.choice.boss{border-color:var(--blood)}
.choice.sm{padding:10px 14px}
.cbody{display:flex;flex-direction:column;min-width:0}
.clbl{font-family:var(--pix);font-size:1.12rem}
.chint{font-size:.78rem;color:var(--muted)}
.dnav{display:flex;gap:8px}
.dnav .btn{flex:1}
.found .eyebrow{color:var(--brass)}
.found-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tapcue{font-family:var(--pix);font-size:.78rem;color:var(--brass-ink);background:var(--brass);padding:2px 10px;border-radius:2px;white-space:nowrap}
.tapcue.no{background:transparent;color:var(--blood);border:1px solid var(--blood)}
button.card.found.tap{width:100%;text-align:left;border-color:var(--brass);cursor:pointer}
button.card.found.tap:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.found .detail,.found .wline{display:flex}
.found .wline{display:block}
.detail{display:flex;gap:12px;align-items:flex-start;min-width:0}
.detail > img{background:var(--well);border:2px solid var(--line);padding:4px;box-sizing:content-box}
.dbody{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.kind{font-size:.72rem;color:var(--muted)}
.lines{margin:0;padding-left:1.1em;font-size:.83rem;display:flex;flex-direction:column;gap:2px}
.cmp{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.cmp b{font-family:var(--pix);font-weight:400}
.wline{font-size:.8rem;color:var(--muted)}
.wline b{font-family:var(--pix);font-weight:400;color:var(--ink)}
.wline b.down{color:var(--blood)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--pix);font-size:.8rem}
.st{border:2px solid var(--line);padding:2px 8px;border-radius:2px;color:var(--muted)}
.st.done{color:var(--heal);border-color:var(--heal)}
.st.now{color:var(--brass);border-color:var(--brass)}
.arr{color:var(--muted)}

.foe{background:radial-gradient(ellipse at 50% 70%,#3b2a22 0%,#15110d 70%);border:2px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.foe-top{width:100%;display:flex;flex-direction:column;gap:6px}
.foe-top h3{font-size:1.1rem}
.foe-pic{padding:4px 0}
.intent{font-size:.85rem;background:#0f0d0b;border:2px solid var(--line);padding:6px 10px;border-radius:2px;width:100%;text-align:center}
.intent.danger{border-color:var(--blood);color:#ffb3a6}
.blog{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:8px 12px;font-size:.82rem;min-height:5.4em;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:8px 12px}
.me .srow{flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:grid;grid-template-columns:28px 1fr;column-gap:8px;align-items:center;padding:10px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;box-shadow:0 4px 0 var(--shadow);text-align:left;min-width:0}
.act img{grid-row:1 / 3}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.act:disabled{opacity:.4;cursor:default}
.an{font-family:var(--pix);font-size:1.02rem}
.ad{font-size:.72rem;color:var(--muted);line-height:1.35}
.bitems{display:flex;flex-direction:column;gap:8px}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.foe.hit .foe-pic{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.me.hit{animation:flash .4s steps(2)}
@keyframes flash{50%{background:#5a1f17}}

.result{display:flex;flex-direction:column;gap:12px;text-align:center;padding-top:20px}
.res-pic{display:flex;justify-content:center}
.result.death .title{color:var(--blood)}
.gitems{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gi{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:4px 8px;font-size:.78rem;border-radius:2px}

.sheet-wrap{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--panel);border:2px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet-acts{display:flex;flex-wrap:wrap;gap:8px}
.sheet-acts .btn{flex:1}
.sh-title{font-size:1.15rem}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}.frame img{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.bob,.foe.hit .foe-pic,.me.hit{animation:none}.bar i{transition:none}}
/* ---------- 出現演出（割り込み） ---------- */
.ci{position:fixed;inset:0;z-index:1000;overflow:hidden;cursor:pointer;font-family:var(--pix);color:#f4ecd8;-webkit-tap-highlight-color:transparent;transition:opacity .25s}
.ci.ci-out{opacity:0}
.ci-bg{position:absolute;inset:0;background:var(--bg0,#000);opacity:0;animation:ciFade .35s ease-out forwards}
.ci-wrap{position:absolute;inset:0}
.ci-fx{position:absolute;inset:0;pointer-events:none}
.ci-stage{position:absolute;left:50%;top:40%;width:min(58vw,250px);aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%)}
.ci-stage img{width:100%;height:100%;image-rendering:pixelated;display:block}
.ci-band{position:absolute;left:-6%;right:-6%;top:66%;padding-block:12px 14px;transform:translateX(-115%) skewX(-10deg);background:linear-gradient(90deg,transparent,var(--c) 14%,var(--c) 86%,transparent);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.5);animation:ciBand .55s cubic-bezier(.2,.9,.25,1) var(--bandAt,2s) forwards}
.ci-band-in{transform:skewX(10deg);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.ci-epi{font-size:.78rem;letter-spacing:.32em;color:var(--epi,#fff7dc);opacity:.92}
.ci-name{font-size:clamp(1.7rem,8vw,2.4rem);letter-spacing:.08em;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.55);color:var(--nameC,#fff)}
.ci-line{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:1.15rem;letter-spacing:.08em;padding-inline:max(16px,env(safe-area-inset-left,0px));min-height:1.5em;text-shadow:0 2px 0 #000}
.ci-skip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-family:var(--ui);font-size:.72rem;color:rgba(255,255,255,.5);letter-spacing:.06em}
.ci-p{position:absolute;pointer-events:none}
@keyframes ciFade{to{opacity:var(--bgOp,.96)}}
@keyframes ciBand{to{transform:translateX(0) skewX(-10deg)}}
@keyframes ciIn{from{opacity:0}to{opacity:1}}
@keyframes ciShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}

/* 石の門番：足音3つで近づき、土ぼこり、最後に目が光る */
.ci-quake{--bg0:#120e0a;--c:#5b5348;--bandAt:2.25s}
.ci-quake .ci-wrap{animation:ciShake .28s linear .3s,ciShake .28s linear .9s,ciShake .32s linear 1.5s}
.ci-quake .ci-stage img{animation:ciApproach 2.3s steps(1,end) forwards,ciEyes .7s ease-out 1.95s forwards;transform:scale(.5);filter:brightness(.2)}
@keyframes ciApproach{0%{transform:scale(.5);filter:brightness(.2)}13%{transform:scale(.66);filter:brightness(.32)}39%{transform:scale(.82);filter:brightness(.45)}65%{transform:scale(1);filter:brightness(.6)}100%{transform:scale(1);filter:brightness(.6)}}
@keyframes ciEyes{0%{filter:brightness(.6)}35%{filter:brightness(1.6) drop-shadow(0 0 14px #f5cf4f)}100%{filter:brightness(1) drop-shadow(0 0 6px rgba(245,207,79,.5))}}
.ci-dust{width:7px;height:7px;background:#8a7f6e;bottom:18%;opacity:0;animation:ciDust 1.1s ease-out var(--d) forwards}
@keyframes ciDust{0%{opacity:.9;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),-70px) scale(2.2)}}

/* 深淵竜：暗闇で目が開き、閃光とともにせり上がる */
.ci-eyes{--bg0:#000;--bgOp:1;--c:#3b2a66;--bandAt:3.1s;--roarAt:2.2s;--ring:#d9c8ff;--ringG:rgba(155,107,224,.55)}
.ci-eye{position:absolute;top:36%;width:34px;height:8px;background:#f5cf4f;box-shadow:0 0 16px 4px rgba(245,207,79,.7);transform:scaleY(0);animation:ciEyeOpen .5s ease-out .45s forwards,ciFadeOut .2s linear 1.45s forwards}
.ci-eye.l{left:calc(50% - 52px)}.ci-eye.r{left:calc(50% + 18px)}
@keyframes ciEyeOpen{0%{transform:scaleY(0)}60%{transform:scaleY(1.4)}100%{transform:scaleY(1)}}
@keyframes ciFadeOut{to{opacity:0}}
.ci-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:ciFlash .45s ease-out var(--fl,1.5s) forwards}
@keyframes ciFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.ci-eyes .ci-stage img{opacity:0;transform:translateY(70%);animation:ciRise .6s cubic-bezier(.2,.9,.25,1) 1.55s forwards,ciLunge .75s ease-out var(--roarAt) 1}
@keyframes ciRise{to{opacity:1;transform:translateY(0)}}


/* 竜の咆哮：身を乗り出し、画面が揺れ、衝撃の音波が輪になって広がる */
.ci-roar .ci-wrap{animation:ciRoarShake .07s linear var(--roarAt) 9}
@keyframes ciRoarShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-9px,5px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-6px,-4px)}}
@keyframes ciLunge{0%{transform:scale(1)}18%{transform:scale(1.16) translateY(-3%)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.ci-ring{left:50%;top:var(--ry,34%);width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--ring);box-shadow:0 0 0 5px var(--ringG),inset 0 0 14px var(--ringG);opacity:0;animation:ciRing 1s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
@keyframes ciRing{0%{opacity:0;transform:scale(.3)}8%{opacity:1}100%{opacity:0;transform:scale(var(--to,13));border-width:1px}}
.ci-burst{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% var(--by,40%),rgba(255,255,255,.22) 0 1.6deg,transparent 1.6deg 9deg);-webkit-mask:radial-gradient(circle at 50% var(--by,40%),transparent 18%,#000 46%);mask:radial-gradient(circle at 50% var(--by,40%),transparent 18%,#000 46%);opacity:0;animation:ciBurst .8s ease-out var(--roarAt) forwards}
@keyframes ciBurst{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.ci-roarflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,var(--ringG),transparent 65%);opacity:0;animation:ciFlash .5s ease-out var(--roarAt) forwards}

/* 黒曜の巨像：ひびが走って割れ、奥から現れる */
.ci-crack{--bg0:#0d0a14;--c:#4a3566;--bandAt:2s}
.ci-half{position:absolute;inset:0;background:linear-gradient(135deg,#2a2433,#1a1622);animation:var(--split) .5s cubic-bezier(.5,0,.75,0) 1.3s forwards}
.ci-half.l{clip-path:polygon(0 0,58% 0,44% 100%,0 100%);--split:ciSplitL}
.ci-half.r{clip-path:polygon(58% 0,100% 0,100% 100%,44% 100%);--split:ciSplitR}
@keyframes ciSplitL{to{transform:translate(-70%,8%) rotate(-6deg);opacity:.0}}
@keyframes ciSplitR{to{transform:translate(70%,-8%) rotate(6deg);opacity:.0}}
.ci-cracks{position:absolute;inset:0;width:100%;height:100%}
.ci-cracks path{fill:none;stroke:#d9cfff;stroke-width:2.2;stroke-linejoin:bevel;filter:drop-shadow(0 0 4px #9b6be0);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ciDraw .55s ease-out var(--d) forwards,ciFadeOut .2s linear 1.35s forwards}
@keyframes ciDraw{to{stroke-dashoffset:0}}
.ci-crack .ci-stage img{opacity:0;animation:ciIn .5s ease-out 1.45s forwards}

/* 冥王竜：赤黒い炎が立ちのぼり、画面が赤く染まる */
.ci-flame{--bg0:#0a0203;--bgOp:1;--c:#7a1c22;--bandAt:2.95s;--roarAt:2.05s;--ring:#ffc7a0;--ringG:rgba(216,70,60,.6)}
.ci-tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(216,70,60,.75),rgba(138,38,48,.35) 45%,transparent 75%);opacity:0;animation:ciIn 1.4s ease-in forwards}
.ci-fl{bottom:-12px;width:var(--s);height:var(--s);background:var(--col);opacity:0;animation:ciFlameUp var(--t) ease-in var(--d) forwards}
@keyframes ciFlameUp{0%{opacity:0;transform:translateY(0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-85vh) scale(.4)}}
.ci-flame .ci-stage img{opacity:0;transform:translateY(25%);animation:ciRise .8s ease-out 1.2s forwards,ciLunge .75s ease-out var(--roarAt) 1}

/* 強欲の王：金貨が降りそそぐ */
.ci-coins{--bg0:#0f0a02;--c:#7a5a12;--epi:#fff1a8;--bandAt:1.85s}
.ci-coin{top:-40px;width:var(--s);height:var(--s);image-rendering:pixelated;opacity:0;animation:ciCoin var(--t) cubic-bezier(.4,0,1,1) var(--d) forwards}
@keyframes ciCoin{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--dx),110vh) rotate(var(--r))}}
.ci-coins .ci-stage img{opacity:0;transform:translateY(-90%);animation:ciDrop .7s cubic-bezier(.3,1.5,.5,1) 1.0s forwards}
@keyframes ciDrop{to{opacity:1;transform:translateY(0)}}

/* 影の王：闇に沈み、赤い目だけが残る */
.ci-dark{--bg0:#000;--bgOp:1;--c:#24202c;--epi:#ffb0a8;--bandAt:2.25s}
.ci-dark .ci-bg{animation:ciFade 1s ease-in forwards}
.ci-reye{position:absolute;top:38%;width:12px;height:12px;background:#ff3b30;box-shadow:0 0 18px 6px rgba(255,59,48,.65);opacity:0;animation:ciIn .5s ease-out .8s forwards,ciFadeOut .4s linear 1.9s forwards}
.ci-reye.l{left:calc(50% - 30px)}.ci-reye.r{left:calc(50% + 18px)}
.ci-dark .ci-stage img{opacity:0;filter:brightness(0);animation:ciSilhouette 1s ease-out 1.4s forwards}
@keyframes ciSilhouette{to{opacity:1;filter:brightness(.75)}}

/* 千手の魔女：魔法陣が描かれ、中心から現れる */
.ci-circle{--bg0:#03100a;--c:#1f5a3a;--epi:#ffc0d4;--bandAt:2.05s}
.ci-mc{position:absolute;left:50%;top:40%;width:min(80vw,330px);aspect-ratio:1;transform:translate(-50%,-50%);animation:ciSpin 6s linear .2s infinite}
.ci-mc svg{width:100%;height:100%;overflow:visible}
.ci-mc *{fill:none;stroke:#7dffb0;stroke-width:1.4;filter:drop-shadow(0 0 4px #4fbf6a);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ciDraw .6s ease-out var(--d) forwards}
@keyframes ciSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ci-circle .ci-stage img{opacity:0;transform:scale(.1);animation:ciGrow .5s cubic-bezier(.2,1.3,.5,1) 1.45s forwards}
@keyframes ciGrow{to{opacity:1;transform:scale(1)}}

/* 亡霊の騎士：霧の中でちらつき、赤い光。第一声 */
.ci-ghost{--bg0:#06090f;--c:#1d3a4a;--epi:#bff2f8;--bandAt:2.5s}
.ci-fog{width:var(--s);height:calc(var(--s) * .55);border-radius:50%;background:rgba(200,220,235,.18);filter:blur(18px);animation:ciFog var(--t) ease-in-out var(--d) infinite alternate}
@keyframes ciFog{from{transform:translateX(-12vw)}to{transform:translateX(12vw)}}
.ci-ghost .ci-stage img{opacity:0;filter:drop-shadow(0 0 10px rgba(255,59,48,.85));animation:ciFlicker 1.4s steps(1,end) .3s forwards}
@keyframes ciFlicker{0%{opacity:0}10%{opacity:.35}18%{opacity:0}30%{opacity:.6}38%{opacity:.15}52%{opacity:.8}60%{opacity:.4}75%{opacity:.85}100%{opacity:.85}}
.ci-ghost-sane{--bg0:#06090f;--c:#1d3a4a}
.ci-ghost-sane .ci-stage img{opacity:.85;animation:ciSane 1.4s ease-in-out .5s forwards;filter:drop-shadow(0 0 10px rgba(255,59,48,.85))}
@keyframes ciSane{to{filter:drop-shadow(0 0 12px rgba(127,209,224,.95));opacity:.9}}

/* 処刑人：鼓動に合わせて縁が赤く脈打ち、気配があふれる */
.ci-pulse{--bg0:#050102;--c:#5a1218;--epi:#ffb0a8;--bandAt:2.1s}
.ci-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(216,30,40,.85) 100%);opacity:0;animation:ciBeat .9s ease-out .15s 2}
@keyframes ciBeat{0%{opacity:0}12%{opacity:.95}30%{opacity:.25}44%{opacity:.85}70%{opacity:.1}100%{opacity:0}}
.ci-kehai{position:absolute;left:0;right:0;top:14%;display:flex;justify-content:center;gap:8px;align-items:center;font-family:var(--ui);font-size:.8rem;color:#ffb0a8}
.ci-kehai i{width:22px;height:12px;border:2px solid #8e2230;background:transparent;animation:ciPip .2s ease-out var(--d) forwards}
@keyframes ciPip{to{background:#ff3b30;box-shadow:0 0 10px #ff3b30}}
.ci-kehai.over{animation:ciShake .3s linear 1.25s 2}
.ci-pulse .ci-stage img{opacity:0;transform:translateX(70%);animation:ciSlide .45s cubic-bezier(.2,.9,.25,1) 1.55s forwards}
@keyframes ciSlide{to{opacity:1;transform:translateX(0)}}

/* 魔物使い：小さな魔物の影が跳ねてから姿を見せる */
.ci-critters{--bg0:#120d1c;--c:#4b3570;--bandAt:1.95s}
.ci-cr{width:44px;height:44px;image-rendering:pixelated;left:var(--x);top:var(--y);opacity:0;animation:ciHop .5s ease-in-out var(--d) 3 alternate,ciIn .2s linear var(--d) forwards}
@keyframes ciHop{from{transform:translateY(0)}to{transform:translateY(-26px)}}
.ci-critters .ci-stage img{opacity:0;transform:scale(.8);animation:ciGrow .5s ease-out 1.35s forwards}

/* 踏破：金色の帯ときらめき */
.ci-banner{--bg0:#0b0905;--bgOp:.85;--c:#a8801f}
.ci-big{position:absolute;left:0;right:0;top:36%;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:ciPop .6s cubic-bezier(.2,1.4,.5,1) .3s forwards;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.ci-big .t1{font-size:1rem;letter-spacing:.3em;color:#fff1a8}
.ci-big .t2{font-size:clamp(3rem,16vw,4.6rem);letter-spacing:.2em;color:#f2c94c;text-shadow:0 4px 0 #5c4310,0 0 30px rgba(242,201,76,.5)}
@keyframes ciPop{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.ci-sp{width:6px;height:6px;background:#fff1a8;box-shadow:0 0 8px #f2c94c;opacity:0;animation:ciTwinkle 1s ease-in-out var(--d) infinite}
@keyframes ciTwinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.4)}}

/* 深層に初めて入る：暗転と一文 */
.ci-title{--bg0:#000;--bgOp:1}
.ci-title .ci-line{top:40%;font-size:1.25rem;color:#d8d0ea}
.ci-title .ci-big{top:52%;animation-delay:2.1s}
.ci-title .ci-big .t2{font-size:clamp(2rem,10vw,3rem);letter-spacing:.14em;color:#c9b4ff;text-shadow:0 0 24px rgba(155,107,224,.6)}

/* 2回目からの短い版：帯だけがさっと出る */
.ci-short{--bgOp:.55}
.ci-short .ci-band{top:42%;--bandAt:.05s;animation-duration:.3s}
.ci-short .ci-band-in{flex-direction:row;justify-content:center;gap:14px}
.ci-short .ci-band-in img{width:52px;height:52px;image-rendering:pixelated}
.ci-short .ci-names{display:flex;flex-direction:column;align-items:flex-start;gap:0}

/* 動きを減らす設定：揺れ・閃光・点滅・粒をやめ、ふわっと出すだけにする */
@media (prefers-reduced-motion: reduce){
  .ci .ci-wrap,.ci .ci-kehai.over{animation:none!important}
  .ci .ci-flash,.ci .ci-p,.ci .ci-vig,.ci .ci-burst,.ci .ci-roarflash{display:none}
  .ci .ci-stage img{animation:ciIn .6s ease-out .3s forwards!important;transform:none!important;filter:none!important}
}
.ci.ci-reduce .ci-wrap,.ci.ci-reduce .ci-kehai.over{animation:none!important}
.ci.ci-reduce .ci-flash,.ci.ci-reduce .ci-p,.ci.ci-reduce .ci-vig,.ci.ci-reduce .ci-burst,.ci.ci-reduce .ci-roarflash{display:none}
.ci.ci-reduce .ci-stage img{animation:ciIn .6s ease-out .3s forwards!important;transform:none!important;filter:none!important}

/* ---------- 黄金の重い箱を開ける ---------- */
.bx{position:fixed;inset:0;z-index:1000;overflow:hidden;cursor:pointer;font-family:var(--pix);color:#f4ecd8;-webkit-tap-highlight-color:transparent;transition:opacity .25s;--g:#f2c94c;--gl:rgba(242,201,76,.75)}
.bx.ci-out{opacity:0}
.bx-bg{position:absolute;inset:0;background:#0b0905;opacity:0;animation:ciFade .3s ease-out forwards;--bgOp:.97}
.bx-stage{position:absolute;left:50%;top:60%;width:min(36vw,140px);aspect-ratio:1;transform:translate(-50%,-50%)}
.bx-stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bx-box{animation:bxRattle .9s linear .15s 1}
@keyframes bxRattle{0%,100%{transform:none}8%{transform:translateY(-6%) rotate(-4deg)}16%{transform:none}38%{transform:translateY(-9%) rotate(5deg)}46%{transform:none}70%{transform:translateY(-13%) rotate(-7deg)}80%{transform:none}}
.bx-lid{clip-path:inset(0 0 56.25% 0);transform-origin:12% 43.75%;animation:bxLid .45s cubic-bezier(.2,1.4,.5,1) 1.05s forwards}
@keyframes bxLid{to{transform:translate(-8%,-30%) rotate(-38deg)}}
.bx-body{clip-path:inset(43.75% 0 0 0)}
.bx-beam{position:absolute;left:50%;bottom:56%;width:150%;height:240%;transform:translateX(-50%);background:linear-gradient(to top,var(--gl),transparent 85%);clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);opacity:0;animation:bxBeam .5s ease-out 1.1s forwards}
@keyframes bxBeam{from{opacity:0;transform:translateX(-50%) scaleY(.2)}to{opacity:1;transform:translateX(-50%) scaleY(1)}}
.bx-rays{position:absolute;left:50%;top:44%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;background:repeating-conic-gradient(var(--gl) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 4%,transparent 30%);mask:radial-gradient(circle,#000 4%,transparent 30%);opacity:0;animation:ciIn .6s ease-out 1.15s forwards,bxSpin 14s linear 1.15s infinite}
@keyframes bxSpin{to{transform:rotate(360deg)}}
.bx-bloom{position:absolute;left:50%;top:52%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;background:radial-gradient(circle,var(--gl),transparent 40%);opacity:0;animation:ciIn .5s ease-out 1.1s forwards}
.bx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:ciFlash .5s ease-out 1.05s forwards}
.bx-items{position:absolute;left:0;right:0;top:20%;display:flex;justify-content:center;gap:clamp(10px,4vw,26px);padding-inline:16px}
.bx-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(30vw,120px);opacity:0;transform:translate(var(--fx),var(--fy)) scale(.2);animation:bxPop .6s cubic-bezier(.2,1.3,.5,1) var(--d) forwards}
@keyframes bxPop{to{opacity:1;transform:none}}
.bx-ic{width:64px;height:64px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:0 0 0 2px var(--g),0 0 18px var(--gl)}
.bx-ic img{width:48px;height:48px;image-rendering:pixelated}
.bx-nm{font-family:var(--ui);font-size:.78rem;line-height:1.3;text-align:center;color:#fff7dc;text-shadow:0 1px 0 #000;overflow-wrap:anywhere}
.bx-grade{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:clamp(1.6rem,8vw,2.3rem);letter-spacing:.2em;color:var(--g);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 24px var(--gl);opacity:0;animation:ciPop .55s cubic-bezier(.2,1.4,.5,1) var(--gd,1.9s) forwards}
.bx-sp{width:6px;height:6px;background:#fff7dc;box-shadow:0 0 8px var(--g);opacity:0;animation:ciTwinkle 1.1s ease-in-out var(--d) infinite}
.bx-hint{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--ui);font-size:.75rem;color:rgba(255,255,255,.55);opacity:0;animation:ciIn .4s linear 2.3s forwards}
.bx-junk{--g:#9a948a;--gl:rgba(180,175,165,.35)}
.bx-legend{--g:#ffe08a;--gl:rgba(255,236,170,.8)}
.bx-legend .bx-rays{background:repeating-conic-gradient(rgba(255,120,120,.6) 0 4deg,transparent 4deg 12deg,rgba(255,230,120,.6) 12deg 16deg,transparent 16deg 24deg,rgba(130,220,255,.6) 24deg 28deg,transparent 28deg 36deg)}
.bx-legend .bx-grade{background:linear-gradient(90deg,#ff8a8a,#ffe08a,#8ad8ff,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bx-skip .bx-anim,.bx-skip .bx-anim *{animation-delay:0s!important;animation-duration:.01s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion: reduce){.bx .bx-box{animation:none}.bx .bx-rays,.bx .bx-flash,.bx .ci-p{display:none}}
.bx.ci-reduce .bx-box{animation:none}.bx.ci-reduce .bx-rays,.bx.ci-reduce .bx-flash,.bx.ci-reduce .ci-p{display:none}

/* 宝箱開封屋の前口上 */
.td{position:fixed;inset:0;z-index:1001;overflow:hidden;cursor:pointer;background:#0b0905;font-family:var(--pix);color:#f4ecd8;-webkit-tap-highlight-color:transparent;animation:ciIn .2s ease-out}
.td-in{position:absolute;inset:0;animation:ciShake .3s linear 1.25s 2}
.td img{position:absolute;left:50%;top:42%;width:min(46vw,190px);aspect-ratio:1;transform:translate(-50%,-50%);image-rendering:pixelated;animation:tdChant .19s steps(1,end) .15s 6,tdJump .45s cubic-bezier(.2,1.5,.5,1) 1.2s forwards}
@keyframes tdChant{0%{transform:translate(-50%,-50%) rotate(-5deg)}50%{transform:translate(-50%,-50%) rotate(5deg)}}
@keyframes tdJump{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-62%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1.05)}}
.td-chant{position:absolute;left:0;right:0;top:14%;text-align:center;font-size:1.35rem;letter-spacing:.12em;min-height:1.5em;padding-inline:16px}
.td-don{position:absolute;left:0;right:0;top:66%;text-align:center;font-size:clamp(2.6rem,13vw,3.8rem);letter-spacing:.06em;color:#f2c94c;text-shadow:0 4px 0 #5c4310,0 0 28px rgba(242,201,76,.6);opacity:0;animation:ciPop .4s cubic-bezier(.2,1.6,.5,1) 1.2s forwards}
@media (prefers-reduced-motion: reduce){.td-in,.td img{animation:none!important}}
.td.ci-reduce .td-in,.td.ci-reduce img{animation:none!important}

const R = () => Math.random();
const rnd = n => Math.floor(R() * n);
const chance = p => R() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[rnd(arr.length)];
const rv = () => 0.9 + R() * 0.2;
function pickW(obj) {
  let tot = 0; for (const k in obj) tot += obj[k];
  let r = R() * tot;
  for (const k in obj) { r -= obj[k]; if (r <= 0) return k; }
  return Object.keys(obj)[0];
}

/* こころのレベルに合わせて技を強める */
function heartSkill(sk, lv) {
  const k = 1 + .2 * (lv - 1), o = {...sk, lv};
  if (o.mult) o.mult *= k;
  if (o.own) o.own *= k;
  if (o.heal) o.heal *= k;
  if (o.vampSk) o.vampSk = Math.min(.8, o.vampSk + .1 * (lv - 1));
  if (o.counterMul) o.counterMul += .2 * (lv - 1);
  if (o.wall) o.wall = Math.min(.75, o.wall + .1 * (lv - 1));
  if (o.swallow) o.swallow += .1 * (lv - 1);
  if (o.execute) o.execute += .05 * (lv - 1);
  if (o.sonar) o.sonar += lv - 1;
  return o;
}

      case 'ghost': s.kehaiMul *= 1 - .1 * L; break;

      case 'shadow': s.mag += 3 * L; break;
      case 'knight': s.def += 2 * L; break;

function rollFloorType(depth, prev) {

/* いつもの持ち物：出発時に倉庫から補充し、足りなければ店で買う */

function presetPlan() {
  const P = G.preset || {}, out = [];

  for (const k of PRESET_ORDER) {
    const want = P[k] || 0; if (!want) continue;
    const have = G.pack.filter(x => x.k === 'cons' && x.type === k).length;
    const need = Math.max(0, want - have);
    const inWh = G.wh.filter(x => x.k === 'cons' && x.type === k).length;
    const fromWh = Math.min(need, inWh);
    const canBuy = sold.includes(k);
    const buy = canBuy ? need - fromWh : 0;
    out.push({k, want, have, fromWh, buy, cost:buy * CONS[k].price, short:need - fromWh - buy});
  }

function applyPreset() {

    let took = 0, bought = 0, spent = 0, stop = '';

      if (townWeight() + 1 > townStats().cap) { stop = '重さの上限'; break; }
      if (i < p.fromWh) {
        const j = G.wh.findIndex(x => x.k === 'cons' && x.type === p.k);
        if (j < 0) break;
        G.pack.push(G.wh.splice(j, 1)[0]); took++;

}

/* 行動ごとの毒と再生 */
function actionTick() {
  const S = pst(), L = [];

    const h = Math.max(1, Math.round(S.maxHp * S.regen));
    D.hp = Math.min(S.maxHp, D.hp + h); L.push(`鎧の力で体力が${h}回復した。`);
  }

    if (TUNE.poisonSafe) { const real = Math.min(d, D.hp - 1); D.hp -= real; L.push(real > 0 ? `毒で${real}の傷を受けた。` : '毒が体を蝕んでいる…（毒では倒れない）'); }

function deeper() {

  ghostknight:{name:'亡霊の騎士', epi:'竜を探して彷徨う亡霊', spr:'ghostknight', fx:'ghost',  dur:4300, line:'……竜は、どこだ', c:'#1d3a4a'},
  ghostsane:  {name:'',           epi:'',                     spr:'ghostknight', fx:'ghost-sane', dur:3200, line:'……っ、痛ってえ……。あれ、俺、何してた？', noBand:true},
  executioner:{name:'徘徊する処刑人', epi:'刻限を告げる刃',     spr:'executioner', fx:'pulse',  dur:3600, c:'#5a1218'},
  tamer:      {name:'魔物使い',   epi:'魔物と心を通わせる者', spr:'tamer',       fx:'critters', dur:3400, c:'#4b3570'},
  clear1:     {big:['始まりの迷宮', '踏破'], fx:'banner', dur:3000},
  clear2:     {big:['黄昏の深淵', '踏破'],   fx:'banner', dur:3000},
  clear3:     {big:['底なしの深層', '初生還'], fx:'banner', dur:3000},
  abyssIn:    {line:'ここから先に、底はない', big:['', '底なしの深層'], fx:'title', dur:3800},
};
let CI_REDUCE = false;
function ciTypeLine(el, text, start, step = 90) {
  [...text].forEach((ch, i) => setTimeout(() => { if (el.isConnected) el.textContent += ch; }, start + i * step));
}
function ciPart(fx, cls, n, setup) {
  for (let i = 0; i < n; i++) { const p = document.createElement('div'); p.className = 'ci-p ' + cls; setup(p, i); fx.appendChild(p); }
}
const ciR = (a, b) => a + Math.random() * (b - a);
function playCutin(key, opt = {}) {
  return new Promise(resolve => {
    const d = CI_DEF[key]; if (!d) return resolve();
    const short = !!opt.short && !d.big && !d.noBand;
    const name = opt.name || d.name, epi = opt.epi ?? d.epi;
    const el = document.createElement('div');
    el.className = `ci ${short ? 'ci-short' : 'ci-' + d.fx}${!short && d.roar ? ' ci-roar' : ''}${CI_REDUCE ? ' ci-reduce' : ''}`;
    if (d.c) el.style.setProperty('--c', d.c);
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', name || (d.big || []).join(' '));
    const img = d.spr ? `<img src="${sprURL(d.spr, '')}" alt="">` : '';
    el.innerHTML = `<div class="ci-bg"></div><div class="ci-wrap"><div class="ci-fx"></div>${short || !d.spr ? '' : `<div class="ci-stage">${img}</div>`}</div>`
      + (d.big && !short ? `<div class="ci-big"><span class="t1">${d.big[0]}</span><span class="t2">${d.big[1]}</span></div>` : '')
      + (!d.noBand && !d.big ? `<div class="ci-band"><div class="ci-band-in">${short ? `${img}<span class="ci-names"><span class="ci-epi">${epi}</span><span class="ci-name">${name}</span></span>` : `<span class="ci-epi">${epi}</span><span class="ci-name">${name}</span>`}</div></div>` : '')
      + `<div class="ci-line"></div><div class="ci-skip">押して飛ばす</div>`;
    const fx = el.querySelector('.ci-fx'), wrap = el.querySelector('.ci-wrap'), line = el.querySelector('.ci-line');
    if (!short) { buildFx(d, fx, wrap, line); if (d.roar) buildRoar(fx, d.fx === 'eyes' ? 2.2 : 2.05); }
    document.body.appendChild(el);
    let done = false;
    const end = () => { if (done) return; done = true; el.classList.add('ci-out'); setTimeout(() => { el.remove(); resolve(); }, 260); };
    el.addEventListener('click', end);
    setTimeout(end, short ? 1250 : d.dur);
  });
}
/* 竜の咆哮：衝撃の輪を何重にも広げ、集中線と光を重ねる */
function buildRoar(fx, at) {
  fx.insertAdjacentHTML('beforeend', '<div class="ci-burst"></div><div class="ci-roarflash"></div>');
  ciPart(fx, 'ci-ring', 5, (p, i) => { p.style.cssText = `--d:${(at + .05 + i * .14).toFixed(2)}s;--to:${(9 + i * 2.2).toFixed(1)}`; });
}
function buildFx(d, fx, wrap, line) {
  const svgNS = 'http://www.w3.org/2000/svg';
  switch (d.fx) {
    case 'quake':
      ciPart(fx, 'ci-dust', 30, (p, i) => { const step = [0.3, 0.9, 1.5][i % 3]; p.style.cssText = `left:${ciR(20, 80)}%;--d:${(step + ciR(0, .12)).toFixed(2)}s;--dx:${ciR(-60, 60).toFixed(0)}px`; });
      break;
    case 'eyes':
      fx.insertAdjacentHTML('beforeend', '<div class="ci-eye l"></div><div class="ci-eye r"></div><div class="ci-flash"></div>');
      break;
    case 'crack': {
      fx.insertAdjacentHTML('beforeend', '<div class="ci-half l"></div><div class="ci-half r"></div>');
      const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('class', 'ci-cracks'); svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('preserveAspectRatio', 'none');
      const cx = 51, cy = 42;
      for (let i = 0; i < 7; i++) {
        const ang = (i / 7) * Math.PI * 2 + ciR(-.3, .3);
        let x = cx, y = cy, dd = `M${x} ${y}`, len = 0;
        for (let s = 0; s < 6; s++) { const st = ciR(6, 12), a = ang + ciR(-.5, .5), nx = x + Math.cos(a) * st, ny = y + Math.sin(a) * st; len += Math.hypot(nx - x, ny - y); x = nx; y = ny; dd += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
        const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', dd); p.setAttribute('vector-effect', 'non-scaling-stroke');
        p.style.setProperty('--len', (len * 6).toFixed(0)); p.style.setProperty('--d', (.2 + i * .1).toFixed(2) + 's');
        svg.appendChild(p);
      }
      fx.appendChild(svg);
      break;
    }
    case 'flame':
      fx.insertAdjacentHTML('beforeend', '<div class="ci-tint"></div>');
      ciPart(fx, 'ci-fl', 54, p => { const s = ciR(6, 16) | 0; p.style.cssText = `left:${ciR(0, 100)}%;--s:${s}px;--col:${['#ec8a33', '#d8463c', '#8a2630', '#f5cf4f'][Math.random() * 4 | 0]};--t:${ciR(1.4, 2.6).toFixed(2)}s;--d:${ciR(0, 1.4).toFixed(2)}s;--dx:${ciR(-30, 30).toFixed(0)}px`; });
      break;
    case 'coins': {
      const coin = sprURL('coin', '');
      for (let i = 0; i < 36; i++) { const c = document.createElement('img'); c.className = 'ci-p ci-coin'; c.src = coin; c.alt = ''; const s = ciR(18, 34) | 0; c.style.cssText = `left:${ciR(0, 96)}%;--s:${s}px;--t:${ciR(1.1, 2).toFixed(2)}s;--d:${ciR(0, 1.5).toFixed(2)}s;--dx:${ciR(-40, 40).toFixed(0)}px;--r:${ciR(-540, 540).toFixed(0)}deg`; fx.appendChild(c); }
      break;
    }
    case 'dark':
      fx.insertAdjacentHTML('beforeend', '<div class="ci-reye l"></div><div class="ci-reye r"></div>');
      break;
    case 'circle': {
      const box = document.createElement('div'); box.className = 'ci-mc';
      const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '-50 -50 100 100');
      const add = (tag, attrs, len, delay) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.style.setProperty('--len', len); e.style.setProperty('--d', delay + 's'); svg.appendChild(e); };
      add('circle', {r:46}, 290, .1); add('circle', {r:38}, 240, .35);
      const tri = rot => [0, 1, 2].map(k => { const a = rot + k * 2 * Math.PI / 3 - Math.PI / 2; return `${(38 * Math.cos(a)).toFixed(1)},${(38 * Math.sin(a)).toFixed(1)}`; }).join(' ');
      add('polygon', {points:tri(0)}, 200, .6); add('polygon', {points:tri(Math.PI)}, 200, .85);
      for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; add('circle', {cx:(42 * Math.cos(a)).toFixed(1), cy:(42 * Math.sin(a)).toFixed(1), r:1.6}, 11, (1 + k * .03).toFixed(2)); }
      box.appendChild(svg); wrap.insertBefore(box, wrap.querySelector('.ci-stage'));
      break;
    }
    case 'ghost':
    case 'ghost-sane':
      ciPart(fx, 'ci-fog', 8, p => { const s = ciR(160, 320) | 0; p.style.cssText = `left:${ciR(-10, 70)}%;top:${ciR(10, 75)}%;--s:${s}px;--t:${ciR(3, 6).toFixed(1)}s;--d:-${ciR(0, 3).toFixed(1)}s`; });
      if (d.line) ciTypeLine(line, d.line, d.fx === 'ghost' ? 1500 : 700, 95);
      break;
    case 'pulse': {
      const k = document.createElement('div'); k.className = 'ci-kehai over';
      k.innerHTML = '<span>気配</span>' + [0, 1, 2, 3].map(i => `<i style="--d:${(.2 + i * .28).toFixed(2)}s"></i>`).join('');
      fx.insertAdjacentHTML('beforeend', '<div class="ci-vig"></div>'); fx.appendChild(k);
      break;
    }
    case 'critters': {
      const pos = [[16, 30], [72, 26], [10, 56], [78, 54], [44, 70]], sprs = ['rat', 'bat', 'slime', 'goblin', 'spider'];
      sprs.forEach((s, i) => { const c = document.createElement('img'); c.className = 'ci-p ci-cr'; c.src = sprURL(s, ''); c.alt = ''; c.style.cssText = `--x:${pos[i][0]}%;--y:${pos[i][1]}%;--d:${(.1 + i * .17).toFixed(2)}s`; fx.appendChild(c); });
      break;
    }
    case 'banner':
      ciPart(fx, 'ci-sp', 26, p => { p.style.cssText = `left:${ciR(4, 96)}%;top:${ciR(18, 70)}%;--d:${ciR(0, 1.2).toFixed(2)}s`; });
      break;
    case 'title':
      ciTypeLine(line, d.line, 300, 120);
      break;
  }
}

/* =========================================================
   黄金の重い箱を開ける演出
   箱が揺れ、ふたが開き、光があふれ、中身が飛び出す。押すと最後まで飛ばし、もう一度押すと閉じる
   ========================================================= */
const BX_GRADE = {'がらくた':'junk', 'そこそこ':'fair', '当たり':'good', '大当たり':'great', '伝説':'legend'};
function playBoxOpen(r, under) {
  return new Promise(resolve => {
    const g = BX_GRADE[r.grade] || 'fair', big = g === 'great' || g === 'legend';
    const el = document.createElement('div');
    el.className = `bx bx-${g}${CI_REDUCE ? ' ci-reduce' : ''}`;
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `黄金の重い箱：${r.grade}`);
    const box = sprURL('goldbox', ''), n = r.got.length;
    const items = r.got.map((it, i) => {
      const [s, t] = itemSpr(it), off = (i - (n - 1) / 2);
      return `<div class="bx-item" style="--d:${(1.3 + i * .16).toFixed(2)}s;--fx:${(-off * 110).toFixed(0)}px;--fy:42vh"><div class="bx-ic"><img src="${sprURL(s, t)}" alt=""></div><div class="bx-nm">${itemName(it)}</div></div>`;
    }).join('');
    el.innerHTML = `<div class="bx-anim"><div class="bx-bg"></div>${g === 'junk' ? '' : '<div class="bx-rays"></div>'}<div class="bx-bloom"></div>
      <div class="bx-stage"><div class="bx-beam"></div><div class="bx-box" style="position:absolute;inset:0"><img class="bx-body" src="${box}" alt=""><img class="bx-lid" src="${box}" alt=""></div></div>
      ${big ? '<div class="bx-flash"></div>' : ''}<div class="bx-items">${items}</div>
      <div class="bx-grade" style="--gd:${(1.4 + n * .16).toFixed(2)}s">${r.grade}</div><div class="bx-hint">押して閉じる</div></div>`;
    if (big) ciPart(el, 'bx-sp', 24, p => { p.style.cssText = `left:${ciR(4, 96)}%;top:${ciR(10, 80)}%;--d:${ciR(1.2, 2.4).toFixed(2)}s`; });
    document.body.appendChild(el);
    if (under) { el.querySelector('.bx-bg').style.animation = 'none'; el.querySelector('.bx-bg').style.opacity = '.97'; setTimeout(() => under.remove(), 60); }
    const t0 = Date.now(); let done = false;
    const end = () => { if (done) return; done = true; el.classList.add('ci-out'); setTimeout(() => { el.remove(); resolve(); }, 260); };
    el.addEventListener('click', () => {
      if (Date.now() - t0 < 2300 && !el.classList.contains('bx-skip')) { el.classList.add('bx-skip'); return; }
      end();
    });
  });
}

/* 宝箱開封屋の前口上：「トリトリトリ……ドーーン！」。押すと飛ばす。終わっても消さずに渡し、箱の演出が上に乗ってから消す */
function playTodonIntro() {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = `td${CI_REDUCE ? ' ci-reduce' : ''}`;
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'トリトリトリ……ドーーン！');
    el.innerHTML = `<div class="td-in"><img src="${sprURL('todon', '')}" alt=""><div class="td-chant"></div><div class="td-don">ドーーン！</div></div><div class="ci-skip">押して飛ばす</div>`;
    ciTypeLine(el.querySelector('.td-chant'), 'トリトリトリ……', 150, 95);
    document.body.appendChild(el);
    let done = false;
    const end = () => { if (done) return; done = true; resolve(el); };
    el.addEventListener('click', end);
    setTimeout(end, 2000);
  });
}

/* ---------- 起動 ---------- */
window.claude?.hot?.snapshot?.(() => ({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
